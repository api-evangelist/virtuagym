  - club
principles:
- name: Visibility
  description: Track the platform subscription and any module add-ons per club / location; there is no per-call API invoice to allocate.
- name: Allocation
  description: Map subscription and add-on cost to clubs / locations and to the member base each serves.
- name: Optimization
  description: Right-size the module bundle to what each location actually uses; consolidate locations under one agreement where volume discounts apply; use incremental API sync to stay within the included request cap rather than paying for higher tiers you do not need.
- name: Accountability
  description: Assign an owner per club / location to review the subscription and add-ons against active member counts at renewal.
