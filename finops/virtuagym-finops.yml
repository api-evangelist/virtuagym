  unit: members
  aggregation: max
  dimensions:
  - account
  - club
- name: module_addons
  description: Optional paid modules (branded app, PRO+ content, access control, advanced integrations) added to the subscription.
  unit: modules
  aggregation: sum
  dimensions:
