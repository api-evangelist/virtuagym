description: >-
  FinOps view of Virtuagym spend. Virtuagym is a quote-based B2B SaaS
  subscription whose cost scales primarily with the number of clients / members
  and the module bundle selected (member management, scheduling, access control,
  digital coaching, branded member app, PRO+ content). There is no usage-based
  API meter - the Public API is included with the underlying club subscription
  and gated by an hourly request cap rather than billed per call. From a cost
  perspective, the dominant driver is the recurring platform subscription (billed
  monthly or annually per the negotiated agreement), with add-on modules and a
  branded app as the main upsell levers. Because pricing is quote-based, exact
  per-member rates are not reconciled here.
notes: >-
  No per-API or per-call charges exist; API access is a feature of the platform
  subscription. Verify the current subscription tiers, module add-ons, and any
  per-member component with Virtuagym sales during reconciliation. Third-party
  review estimates (roughly $120-150/mo small studio, $300-600/mo mid-size,
  higher for enterprise) are indicative only, not official rates.
