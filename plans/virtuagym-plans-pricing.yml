    roughly $300-600 per month depending on client count and modules.
  entries:
  - label: Monthly Subscription
    name: club_monthly
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: quote-based (reported ~$300-600/mo)
    userMultiplied: false
  elements:
