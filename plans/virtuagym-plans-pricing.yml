    name: studio_monthly
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: quote-based (reported ~$120-150/mo entry point)
    userMultiplied: false
  elements:
  - name: Member Management
  - name: Scheduling
  - name: Digital Coaching
  - name: Public API Access
- id: virtuagym-club
  name: Club / Mid-Size
  type: subscription
  description: >-
    Growth tier for single- and multi-room clubs adding access control,
