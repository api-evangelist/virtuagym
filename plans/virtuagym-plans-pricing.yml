description: >-
  Virtuagym is sold as a quote-based B2B SaaS subscription rather than at
  publicly posted flat rates. The pricing page routes to a quote form that asks
  for business type, number of clients / members, and which modules you want
  (member management, scheduling, access control, digital coaching, a branded
  member app, PRO+ content, and more). Effective cost scales primarily with the
  size of the member base and the selected module bundle, so the model is best
  understood as per-member / per-business-size SaaS. Public review aggregators
  report a practical entry point around $120-150 per month for a small studio,
  roughly $300-600 per month for mid-size clubs, and materially higher for
  enterprise / multi-location deployments; there is no public self-serve free
  trial and a sales conversation precedes real numbers. The Public API is
  included with a Virtuagym subscription (you provision api_key and club_secret
  in the portal); it is not sold or metered as a standalone product. Exact rates,
  tier names, and per-member pricing are not reconciled here.
notes: >-
  Figures above are third-party review-aggregator estimates, not official
  Virtuagym list prices. Verify the current module bundles and quote on
  business.virtuagym.com/our-prices during reconciliation. No public per-API or
  per-call price exists - API access rides on the underlying club subscription.
sources:
- https://business.virtuagym.com/our-prices/
- https://virtuagym.com
- https://support.virtuagym.com/s/article/API-Link-To-Your-Website
