  - name: Membership Billing and Invoices
  - name: Access Control and Check-ins
  - name: Scheduling and Events
  - name: Public API Access
- id: virtuagym-enterprise
  name: Enterprise / Multi-Location
  type: enterprise
  description: >-
    Custom tier for large, multi-location operators and franchises, corporate
    wellness, and businesses needing a branded member app, PRO+ content,
    advanced integrations, and negotiated terms. Contact Virtuagym sales.
  entries:
