aid: virtuagym
url: https://raw.githubusercontent.com/api-evangelist/virtuagym/refs/heads/main/apis.yml
name: Virtuagym
kind: company
description: >-
  Virtuagym is a Netherlands-based fitness and health club management platform
  that combines member management, membership and billing administration, class
  and appointment scheduling, access control / check-ins, and digital coaching
  (workouts, nutrition, and a branded member app) into one SaaS suite for gyms,
  studios, personal trainers, and corporate wellness programs. Its Public API
  (v1) is club-scoped and lets partners and businesses read and write members,
  employees, membership definitions and instances, member credits, invoices,
  visits (check-ins), events (classes) and participants, and coaching workout
  assignments. v1 endpoints authenticate with an api_key plus a club_secret
  passed as query parameters over HTTPS. Authoritative reference documentation is
  access-gated (request via api@virtuagym.com); the endpoints modeled here are
  grounded in Virtuagym's publicly mirrored API wiki and live host probes.
