  endpointsModeledNote: |
    Additional documented v1 resources exist that were not fully modeled in the
    OpenAPI because exact paths / methods were not confirmable from public
    sources: Club Member Bodymetrics and Club Member Notes. A deprecated v0 API
    (Basic Auth) also exists covering user, activity, bodymetric, food plan,
    group, and share resources. Reconcile these against the access-gated official
    reference before treating them as complete.
  sources:
    - url: https://support.virtuagym.com/s/article/API-Link-To-Your-Website
      type: Documentation
      note: Official support article on linking the Virtuagym API; confirms api_key + club_secret, HTTPS, and the ~500 requests/hour cap.
    - url: https://github.com/anokabb/virtuagym-public-api
      type: APIReference
      note: Public mirror of Virtuagym's official API wiki; source of v1 endpoint paths, methods, and query parameters (Authorization, Club-Members, Club-Visits, Club-Events, etc).
    - url: https://github.com/anokabb/virtuagym-public-api/blob/main/documentation/Authorization.md
      type: Documentation
      note: Base URL https://api.virtuagym.com/api; api_key + club_secret query params for v1; Basic Auth for v0; OAuth 2.0 for user context.
    - url: https://apitracker.io/a/virtuagym
      type: Reference
      note: Third-party catalog listing of Virtuagym API resources and the ~500 requests/hour limit.
    - url: https://business.virtuagym.com/our-prices/
      type: Pricing
      note: Quote-based pricing routed through a form; no public flat rates.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or other server-push protocol surface exists on Virtuagym's own
    API. The documented Public API is request/response REST (v1, api_key +
    club_secret) plus an OAuth 2.0 flow for user context, and change tracking is
    done by client-side polling with sync_from timestamps. No AsyncAPI document
    was created because there is no ws:// / wss:// or SSE transport to model.
