aid: virtuagym
name: Virtuagym
review:
  question: Does Virtuagym expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Virtuagym's documented Public API (v1) is
    request/response REST over HTTPS, authenticated with api_key + club_secret
    query parameters. No server-push transport - no WebSocket (wss://) and no
    documented Server-Sent Events channel - is published on Virtuagym's own API.
    Near-real-time integration is done by polling the list endpoints with a
    sync_from millisecond timestamp (e.g. new members, new membership instances,
    new visits/check-ins since the last check), not by a streaming socket. There
    is therefore no WebSocket/event surface to model as AsyncAPI.
findings:
  summary: |
    Virtuagym does not publish a documented public WebSocket API. Virtuagym is a
    fitness / health club management SaaS. Its Public API v1 is club-scoped REST
    under base https://api.virtuagym.com/api, with resources for members,
    employees, membership definitions and instances, member credits, invoices,
    visits (check-ins), events (classes) and event participants, and coaching
    workout assignments. All v1 endpoints authenticate with an api_key plus a
    club_secret passed as query-string parameters, over HTTPS only. Consumers
    stay current by polling list endpoints with a sync_from (ms) timestamp and
    from_id cursor - a pull model, not a WebSocket push. No ws:// or wss://
    endpoint is documented anywhere in the Virtuagym API reference as of the
    review date.
  accessModel: |
    Virtuagym's authoritative API reference is access-gated: a developer requests
    access by emailing api@virtuagym.com with their GitHub username, and
    provisions an api_key and club_secret in the Virtuagym portal under System
    settings > Business info > Advanced. The endpoints, methods, and query
    parameters captured here are grounded in Virtuagym's publicly mirrored API
    wiki (github.com/anokabb/virtuagym-public-api) and confirmed against live host
    probes; request/response bodies are modeled honestly with additive
    (additionalProperties) schemas and should be reconciled once official access
    is granted.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.virtuagym.com/api
      documented: true
      note: Club-scoped v1 Public API. api_key + club_secret query-parameter auth. HTTPS required.
    - protocol: HTTP Polling
      scheme: https
      documented: true
      note: Change tracking via list endpoints with sync_from (ms timestamp) and from_id cursor. Client-initiated polling, not server push.
    - protocol: OAuth 2.0
      scheme: https
      documented: true
      note: Separate authorization-code flow for end-user-context calls (authorize at www.virtuagym.com/oauth/authorize, token at virtuagym.com/oauth/token). Still REST, no socket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Virtuagym Public API reference as of the review date.
